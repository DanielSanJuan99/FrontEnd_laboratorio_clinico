<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card border-0 shadow-sm p-4" style="max-width: 400px; width: 100%;">

        <div class="card-body">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-secondary">Bienvenido</h3>
                <p class="text-muted small">Ingresa tus credenciales para continuar</p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div class="form-floating mb-3">
                <input 
                type="email" 
                class="form-control" 
                id="emailInput" 
                placeholder="name@example.com"
                formControlName="email"
                [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                <label for="emailInput">Correo Electrónico</label>
                <div class="invalid-feedback">
                Ingresa un correo válido.
                </div>
            </div>

            <div class="form-floating mb-4">
                <input 
                type="password" 
                class="form-control" 
                id="passwordInput" 
                placeholder="Password"
                formControlName="password"
                [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                <label for="passwordInput">Contraseña</label>
                <div class="invalid-feedback">
                La contraseña es requerida.
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg" [disabled]="isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                {{ isLoading ? 'Ingresando...' : 'Iniciar Sesión' }}
                </button>
            </div>

            </form>
        </div>

        <div class="card-footer bg-transparent border-0 text-center mt-3">
            <small class="text-muted">Laboratorio Clínico v1.0</small>
        </div>
    </div>
</div>
